{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ExpressDisplay Agent — Prospection B2B Autonome & Qualification IA</title>
  <meta name="description" content="Plateforme intelligente de sourcing commercial B2B pour ExpressDisplay. Détection d'opportunités et scoring d'affinité Gemini 1.5 Flash.">
  <link rel="icon" type="image/png" href="{% static 'expressdisplay-logo.png' %}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #070a12;
      --bg-surface: #0e1424;
      --bg-card: #121b30;
      --bg-card-hover: #18233e;
      --brand-blue: #0066ff;
      --brand-blue-glow: rgba(0, 102, 255, 0.35);
      --brand-cyan: #38bdf8;
      --brand-cyan-glow: rgba(56, 189, 248, 0.25);
      --accent-emerald: #10b981;
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-bright: rgba(0, 102, 255, 0.35);
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 20px;
      --radius-full: 9999px;
      --font-body: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      --font-display: 'Outfit', 'Plus Jakarta Sans', system-ui, sans-serif;
      --ease: cubic-bezier(0.16, 1, 0.3, 1);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      min-height: 100vh;
      background-color: var(--bg-dark);
      color: var(--text-primary);
      font-family: var(--font-body);
      line-height: 1.6;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      -webkit-font-smoothing: antialiased;
    }

    /* Ambient background glowing orbs */
    .ambient-glow {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }
    .glow-orb-1 {
      position: absolute;
      top: -15%;
      left: 20%;
      width: 750px;
      height: 750px;
      background: radial-gradient(circle, rgba(0, 102, 255, 0.18) 0%, rgba(0, 102, 255, 0) 70%);
      filter: blur(90px);
      animation: floatOrb 18s ease-in-out infinite alternate;
    }
    .glow-orb-2 {
      position: absolute;
      top: 30%;
      right: -10%;
      width: 650px;
      height: 650px;
      background: radial-gradient(circle, rgba(56, 189, 248, 0.14) 0%, rgba(56, 189, 248, 0) 70%);
      filter: blur(90px);
      animation: floatOrb 22s ease-in-out infinite alternate-reverse;
    }
    .glow-orb-3 {
      position: absolute;
      bottom: -15%;
      left: 15%;
      width: 800px;
      height: 600px;
      background: radial-gradient(circle, rgba(139, 92, 246, 0.10) 0%, rgba(139, 92, 246, 0) 70%);
      filter: blur(100px);
    }

    @keyframes floatOrb {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(60px, 40px) scale(1.08); }
    }

    /* Grid pattern overlay */
    .bg-grid {
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(to right, rgba(255, 255, 255, 0.02) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
      background-size: 48px 48px;
      mask-image: radial-gradient(circle at 50% 35%, black 45%, transparent 80%);
      pointer-events: none;
      z-index: 0;
    }

    .container {
      max-width: 1240px;
      margin: 0 auto;
      padding: 0 24px;
      position: relative;
      z-index: 1;
      width: 100%;
    }

    /* =========================================================================
       CLEAN NAVBAR (Brand + AI Status)
       ========================================================================= */
    .navbar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(7, 10, 18, 0.82);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-bottom: 1px solid var(--border-subtle);
    }

    .nav-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 76px;
    }

    .brand-wrap {
      display: flex;
      align-items: center;
      gap: 14px;
      text-decoration: none;
      color: inherit;
    }

    .brand-logo-img {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 102, 255, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: #ffffff;
      padding: 4px;
      transition: transform 0.3s var(--ease);
      object-fit: contain;
    }

    .brand-wrap:hover .brand-logo-img {
      transform: scale(1.06) rotate(-2deg);
    }

    .brand-name {
      font-family: var(--font-display);
      font-size: 1.45rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 8px;
      line-height: 1.1;
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .status-pill {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 0.78rem;
      font-weight: 600;
      color: #34d399;
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.25);
      padding: 6px 14px;
      border-radius: var(--radius-full);
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 10px #10b981;
      animation: pulseDot 2s infinite;
    }

    @keyframes pulseDot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }

    /* =========================================================================
       HERO & RESEARCH INTERFACE
       ========================================================================= */
    .hero {
      padding: 60px 0 70px;
      position: relative;
      text-align: center;
      margin: auto 0;
    }

    .hero-title {
      font-family: var(--font-display);
      font-size: clamp(2.3rem, 5.2vw, 4.1rem);
      font-weight: 800;
      line-height: 1.12;
      letter-spacing: -0.03em;
      max-width: 980px;
      margin: 0 auto 20px;
      color: #ffffff;
    }

    .hero-title .gradient-text {
      background: linear-gradient(135deg, #ffffff 30%, #38bdf8 80%, #0066ff 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: inline;
    }

    /* Research Card */
    .hero-search-card {
      max-width: 860px;
      margin: 0 auto 40px;
      background: rgba(18, 27, 48, 0.75);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(56, 189, 248, 0.28);
      border-radius: var(--radius-lg);
      padding: 24px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 35px rgba(0, 102, 255, 0.2);
      transition: all 0.3s var(--ease);
      text-align: left;
    }

    .hero-search-card:focus-within {
      border-color: var(--brand-cyan);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.7), 0 0 45px rgba(56, 189, 248, 0.35);
    }

    .search-input-box {
      display: flex;
      align-items: center;
      gap: 12px;
      background: #090d16;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: var(--radius-md);
      padding: 6px 14px;
      margin-bottom: 20px;
      transition: border-color 0.2s var(--ease), box-shadow 0.2s var(--ease);
    }

    .search-input-box:focus-within {
      border-color: #3b82f6;
      box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.3);
    }

    .search-input-prefix {
      color: var(--brand-cyan);
      display: flex;
      align-items: center;
    }

    .search-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #ffffff;
      font-family: var(--font-body);
      font-size: 1.05rem;
      padding: 12px 6px;
    }

    .search-input::placeholder {
      color: var(--text-muted);
    }

    /* Filters Grid (Score IA + Produit ExpressDisplay Cible) */
    .filters-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
      margin-bottom: 22px;
    }

    .filter-field {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .filter-label {
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--text-secondary);
      letter-spacing: -0.01em;
    }

    .filter-select-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }

    .filter-select {
      width: 100%;
      background: #090d16;
      border: 2px solid #3b82f6;
      border-radius: 10px;
      padding: 12px 42px 12px 16px;
      color: #f8fafc;
      font-family: var(--font-body);
      font-size: 0.95rem;
      font-weight: 500;
      appearance: none;
      -webkit-appearance: none;
      outline: none;
      cursor: pointer;
      transition: all 0.2s var(--ease);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
    }

    .filter-select:hover {
      border-color: #60a5fa;
      background: #0d1424;
    }

    .filter-select:focus {
      border-color: #60a5fa;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.35), 0 0 20px rgba(59, 130, 246, 0.4);
    }

    .filter-select option {
      background: #0b101d;
      color: #ffffff;
      padding: 12px;
      font-size: 0.95rem;
    }

    .filter-select-arrow {
      position: absolute;
      right: 14px;
      pointer-events: none;
      color: #94a3b8;
      display: flex;
      align-items: center;
    }

    /* Action submit row */
    .search-action-wrap {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 14px;
    }

    .search-btn {
      background: linear-gradient(135deg, #0066ff, #0052cc);
      color: #ffffff;
      border: none;
      border-radius: var(--radius-md);
      padding: 14px 32px;
      font-family: var(--font-body);
      font-size: 1rem;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      box-shadow: 0 4px 20px var(--brand-blue-glow);
      transition: all 0.25s var(--ease);
      width: 100%;
      justify-content: center;
    }

    .search-btn:hover {
      background: linear-gradient(135deg, #1a75ff, #005ce6);
      transform: translateY(-1px);
      box-shadow: 0 8px 30px rgba(0, 102, 255, 0.55);
    }

    .search-btn:active {
      transform: translateY(0);
    }

    /* Footer */
    .footer {
      border-top: 1px solid var(--border-subtle);
      padding: 30px 0;
      background: #05070d;
      color: var(--text-muted);
      font-size: 0.84rem;
    }

    .footer-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 16px;
    }

    .footer-brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .footer-brand img {
      width: 30px;
      height: 30px;
      border-radius: 8px;
      background: #ffffff;
      padding: 2px;
    }

    @media (max-width: 680px) {
      .filters-grid {
        grid-template-columns: 1fr;
      }
      .hero-search-card {
        padding: 18px;
      }
    }

    @media (max-width: 640px) {
      .nav-inner {
        flex-direction: column;
        height: auto;
        padding: 16px 0;
        gap: 14px;
      }
    }
  </style>
</head>
<body>

  <!-- Ambient Glow Background -->
  <div class="ambient-glow">
    <div class="glow-orb-1"></div>
    <div class="glow-orb-2"></div>
    <div class="glow-orb-3"></div>
  </div>
  <div class="bg-grid"></div>

  <!-- Minimal Header / Navbar -->
  <header class="navbar">
    <div class="container nav-inner">
      <a href="/" class="brand-wrap">
        <img src="{% static 'expressdisplay-logo.png' %}" alt="ExpressDisplay Logo" class="brand-logo-img">
        <div class="brand-name">
          ExpressDisplay Agent
        </div>
      </a>

    </div>
  </header>

  <!-- Hero & Research Interface -->
  <main class="hero">
    <div class="container">
      <h1 class="hero-title">
        Prospection B2B Autonome &amp; <br>
        <span class="gradient-text">Qualification IA en Temps Réel</span>
      </h1>

      <!-- The Research Input Card -->
      <div class="hero-search-card">
        <form onsubmit="event.preventDefault();">
          <!-- URL Input Bar -->
          <div class="search-input-box">
            <div class="search-input-prefix">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
            </div>
            <input
              type="text"
              name="url"
              id="urlInput"
              class="search-input"
              placeholder="SmartBoard"
              required
            >
          </div>

          <!-- Selectors: Score IA & Produit ExpressDisplay Cible -->
          <div class="filters-grid">
            <div class="filter-field">
              <label for="scoreSelect" class="filter-label">Score IA de pertinence</label>
              <div class="filter-select-wrap">
                <select name="score" id="scoreSelect" class="filter-select">
                  <option value="ALL">Tous les scores</option>
                  <option value="HIGH">Score Élevé (&gt; 85%)</option>
                  <option value="MED">Score Moyen (70% - 85%)</option>
                </select>
                <div class="filter-select-arrow">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m6 9 6 6 6-6"/></svg>
                </div>
              </div>
            </div>

            <div class="filter-field">
              <label for="productSelect" class="filter-label">Produit ExpressDisplay Cible</label>
              <div class="filter-select-wrap">
                <select name="product" id="productSelect" class="filter-select">
                  <option value="ALL">Tous les produits</option>
                  <option value="BORNE">Borne de Tickets / File d'attente</option>
                  <option value="SMARTBOARD" selected>Smart Board Interactif</option>
                  <option value="TOTEM">Totems Digitaux (Intérieur/Extérieur)</option>
                  <option value="VIDEOWALL">Video Wall / Mur d'écrans</option>
                  <option value="STRETCH">Stretch Screens (Boutiques/Linéaires)</option>
                  <option value="DISPLAY">Écrans d'affichage dynamique</option>
                </select>
                <div class="filter-select-arrow">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m6 9 6 6 6-6"/></svg>
                </div>
              </div>
            </div>
          </div>

          <!-- Action Row -->
          <div class="search-action-wrap">
            <button type="submit" class="search-btn" id="analyzeBtn">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
              <span>Identifier &amp; Détecter les Opportunités</span>
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
            </button>
          </div>
        </form>
      </div>
    </div>
  </main>

  <!-- Minimal Footer -->
  <footer class="footer">
    <div class="container footer-inner">
      <div class="footer-brand">
        <img src="{% static 'expressdisplay-logo.png' %}" alt="ExpressDisplay Logo">
        <div>
          <strong style="color: #ffffff;">ExpressDisplay Agent</strong>
          <span style="display: block; font-size: 0.76rem;">Plateforme d'Intelligence Commerciale B2B pour ExpressDisplay Tunisie</span>
        </div>
      </div>
    </div>
  </footer>
</body>
</html>
